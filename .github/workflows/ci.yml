name: Continuous Integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run tests with coverage
        run: python -m pytest tests -q --cov=src/trust_mas --cov-report=xml:coverage.xml --cov-fail-under=90
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-python-312
          path: coverage.xml

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting and lint
        run: ruff format --check . && ruff check .
      - name: Check types
        run: mypy src
      - name: Run static security analysis
        run: bandit -r src -q && semgrep scan --config auto --error --quiet
      - name: Audit dependency vulnerabilities
        run: pip-audit -r requirements.txt && pip-audit -r requirements-gemini.txt && pip-audit -r requirements-ollama.txt
      - name: Generate software bill of materials
        run: python -m pip freeze --all | cyclonedx-py requirements - --output-reproducible -o sbom.cdx.json
      - name: Upload software bill of materials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and test container
        run: docker build --tag trust-mas:ci . && docker run --rm trust-mas:ci
      - name: Scan container image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: trust-mas:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
