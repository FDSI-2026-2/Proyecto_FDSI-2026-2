name: Continuous Integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --only-binary=:all --require-hashes -r requirements-test.lock
      - name: Run tests with coverage
        run: python -m pytest tests -q --cov=src/trust_mas --cov-report=xml:coverage.xml --cov-fail-under=90
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-python-312
          path: coverage.xml

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install --only-binary=:all --require-hashes -r requirements-dev.lock
      - name: Check formatting and lint
        run: ruff format --check . && ruff check .
      - name: Check types
        run: mypy src
      - name: Run static security analysis
        run: bandit -r src -q && semgrep scan --config auto --error --quiet
      - name: Audit dependency vulnerabilities
        run: pip-audit -r requirements-test.lock && pip-audit -r requirements-gemini.lock && pip-audit -r requirements-ollama.lock
      - name: Generate software bill of materials
        run: python -m pip freeze --all | cyclonedx-py requirements - --output-reproducible -o sbom.cdx.json
      - name: Upload software bill of materials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download Gitleaks
        run: |
          curl --fail --location --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar --extract --file gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan repository history for secrets
        run: ./gitleaks git --redact --log-opts="--all"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test container
        run: docker build --tag trust-mas:ci . && docker run --rm trust-mas:ci
      - name: Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trust-mas:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln
          pkg-types: os
